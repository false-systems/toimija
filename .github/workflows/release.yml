name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build toimija-linux-aarch64
    runs-on: arc-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          if command -v cc >/dev/null 2>&1; then
            exit 0
          fi
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "::error::runner is missing cc and apt-get; install a C toolchain on the runner image"
            exit 1
          fi
          sudo_cmd=""
          if [ "$(id -u)" -ne 0 ]; then
            if ! command -v sudo >/dev/null 2>&1; then
              echo "::error::runner is missing cc and needs sudo or root to install build-essential"
              exit 1
            fi
            sudo_cmd="sudo"
          fi
          $sudo_cmd apt-get update
          $sudo_cmd apt-get install -y --no-install-recommends build-essential ca-certificates

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/toimija dist/toimija-linux-aarch64
          chmod +x dist/toimija-linux-aarch64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: toimija-linux-aarch64
          path: dist/toimija-linux-aarch64
