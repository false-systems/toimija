name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# One run per ref: a superseded push cancels the run it replaced instead of
# both finishing on hosted minutes. Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The runners' egress is rate-limited for anonymous git-over-HTTPS
      # ("could not read Username for 'https://github.com'"), which breaks
      # cargo's fetch of the public git dependencies (the protocol crate).
      # Present the job's read-only token for the org's
      # URLs: authenticated reads are never anonymous-limited, and the rewrite
      # is scoped to this organisation so nothing else changes behavior.
      - name: Authenticate git dependency fetches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/false-systems/".insteadOf "https://github.com/false-systems/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          if command -v cc >/dev/null 2>&1; then
            exit 0
          fi
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "::error::runner is missing cc and apt-get; install a C toolchain on the runner image"
            exit 1
          fi
          sudo_cmd=""
          if [ "$(id -u)" -ne 0 ]; then
            if ! command -v sudo >/dev/null 2>&1; then
              echo "::error::runner is missing cc and needs sudo or root to install build-essential"
              exit 1
            fi
            sudo_cmd="sudo"
          fi
          $sudo_cmd apt-get update
          $sudo_cmd apt-get install -y --no-install-recommends build-essential ca-certificates

      - name: Check formatting
        run: cargo fmt --check

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # The same gate as a sykli execution contract (sykli.json). Advisory while it
  # proves itself on these runners; the `rust` job above stays the required
  # gate until branch protection is flipped deliberately.
  sykli:
    name: Sykli
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Same rationale as the rust job: a cold cache on these runners must
      # still be able to fetch the public git dependencies.
      - name: Authenticate git dependency fetches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/false-systems/".insteadOf "https://github.com/false-systems/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          if command -v cc >/dev/null 2>&1; then
            exit 0
          fi
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "::error::runner is missing cc and apt-get; install a C toolchain on the runner image"
            exit 1
          fi
          sudo_cmd=""
          if [ "$(id -u)" -ne 0 ]; then
            if ! command -v sudo >/dev/null 2>&1; then
              echo "::error::runner is missing cc and needs sudo or root to install build-essential"
              exit 1
            fi
            sudo_cmd="sudo"
          fi
          $sudo_cmd apt-get update
          $sudo_cmd apt-get install -y --no-install-recommends build-essential ca-certificates

      # sykli's Action can
      # only install a release, or build the sykli repo itself (`version:
      # source` builds the *caller's* checkout), and there is no release yet.
      # So install it the way its README documents, pinned to the commit the
      # contract was locked with; move to the Action once a release exists.
      - name: Install sykli
        run: cargo install --locked --git https://github.com/false-systems/sykli --rev 49018290537876467ed0bf7ed8caf8001d3187bf sykli

      - name: Run the sykli contract
        run: sykli run
