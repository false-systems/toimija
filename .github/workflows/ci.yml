name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# One run per ref: a superseded push cancels the run it replaced instead of
# both finishing on hosted minutes. Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The arc runners' egress is rate-limited for anonymous git-over-HTTPS
      # ("could not read Username for 'https://github.com'"), which breaks
      # cargo's fetch of the public git dependencies (the protocol crate, the
      # optional sykli SDK). Present the job's read-only token for the org's
      # URLs: authenticated reads are never anonymous-limited, and the rewrite
      # is scoped to false-systems so nothing else changes behavior.
      - name: Authenticate git dependency fetches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/false-systems/".insteadOf "https://github.com/false-systems/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          if command -v cc >/dev/null 2>&1; then
            exit 0
          fi
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "::error::runner is missing cc and apt-get; install a C toolchain on the runner image"
            exit 1
          fi
          sudo_cmd=""
          if [ "$(id -u)" -ne 0 ]; then
            if ! command -v sudo >/dev/null 2>&1; then
              echo "::error::runner is missing cc and needs sudo or root to install build-essential"
              exit 1
            fi
            sudo_cmd="sudo"
          fi
          $sudo_cmd apt-get update
          $sudo_cmd apt-get install -y --no-install-recommends build-essential ca-certificates

      - name: Check formatting
        run: cargo fmt --check

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # The same gate as a sykli execution contract (sykli.rs). Advisory while it
  # proves itself on these runners; the `rust` job above stays the required
  # gate until branch protection is flipped deliberately
  # (docs/qa/ci-quality-gates.md: never silently swap a required gate).
  sykli:
    name: Sykli
    runs-on: ubuntu-24.04-arm
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Same rationale as the rust job: a cold cache on these runners must
      # still be able to fetch the public git dependencies.
      - name: Authenticate git dependency fetches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/false-systems/".insteadOf "https://github.com/false-systems/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          if command -v cc >/dev/null 2>&1; then
            exit 0
          fi
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "::error::runner is missing cc and apt-get; install a C toolchain on the runner image"
            exit 1
          fi
          sudo_cmd=""
          if [ "$(id -u)" -ne 0 ]; then
            if ! command -v sudo >/dev/null 2>&1; then
              echo "::error::runner is missing cc and needs sudo or root to install build-essential"
              exit 1
            fi
            sudo_cmd="sudo"
          fi
          $sudo_cmd apt-get update
          $sudo_cmd apt-get install -y --no-install-recommends build-essential ca-certificates

      # @main deliberately: the v0.9.0-rc.1 tag's action predates the composite
      # rewrite — it builds from source and then runs sykli in its own build
      # directory instead of the workspace. Pin to the next tagged release.
      # Repo renamed 2026-08-04: the Elixir sykli lives at sykli-elixir; the
      # sykli name now belongs to its Rust successor.
      - name: Run the sykli contract
        uses: false-systems/sykli-elixir@main
        with:
          path: .
