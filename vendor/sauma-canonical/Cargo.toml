[package]
name = "sauma-canonical"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "The canonical crate: the sauma envelope, its canonical byte string, and every digest over it. The only code in the workflow stack allowed to hash an artifact."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
