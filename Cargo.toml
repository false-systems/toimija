[workspace]
members = ["xtask"]
# Bare `cargo build/test/clippy` (and CI/release) target only the root crate.
# `xtask` and its dev-only deps are built solely via `cargo xtask ...`.
default-members = ["."]

[package]
name = "toimija"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
default-run = "toimija"

[dependencies]
anyhow = "1"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive"] }
notify = "8.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Vendored: the canonical crate sauma wrote, for the packet's seal
# (`src/seal.rs`). Sauma is archived; Toimija keeps this copy as its own.
# Pinned by `vendor/sauma-canonical.contract`, which a test checks on every
# run, so an edit to the crate fails the build.
sauma-canonical = { path = "vendor/sauma-canonical" }
# Vendored, not fetched: faija is private, and a git dependency would cost
# every build a credential. Faija owns tree-identity.v1, the identity of a
# working State, and Toimija runs its procedure instead of keeping its own.
# Pinned by `vendor/faija-terms.contract`; refresh with the script beside it.
faija-terms = { path = "vendor/faija-terms" }
# Toimija hashes for things that are not artifact envelopes — consistency
# tokens, environment digests, repository points. Those stay here; only the
# envelope digest moved to sauma-canonical.
sha2 = "0.10"
signal-hook = "0.3"
false-agent-protocol = { version = "0.1.3", git = "https://github.com/false-systems/false-agent-protocol.git", tag = "v0.1.3" }
libc = "0.2"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
which = "8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
