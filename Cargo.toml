[workspace]
members = ["xtask"]
# Bare `cargo build/test/clippy` (and CI/release) target only the root crate.
# `xtask` and its dev-only deps are built solely via `cargo xtask ...`.
default-members = ["."]

[package]
name = "toimija"
version = "0.9.0"
edition = "2024"
rust-version = "1.98"
description = "Git-aware local context for coding agents: it reports facts and refuses to decide."
license = "MIT"
repository = "https://github.com/false-systems/toimija"
readme = "README.md"
keywords = ["agents", "git", "context", "cli"]
categories = ["command-line-utilities", "development-tools"]
# The package is the source, the build script, the README and the licence: no
# tests, fixtures, CI files, xtask or agent guides.
include = ["src/**", "build.rs", "Cargo.toml", "README.md", "LICENSE"]
default-run = "toimija"

[dependencies]
anyhow = "1"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
signal-hook = "0.3"
libc = "0.2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
