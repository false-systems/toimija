[workspace]
members = ["xtask"]
# Bare `cargo build/test/clippy` (and CI/release) target only the root crate.
# `xtask` and its dev-only deps are built solely via `cargo xtask ...`.
default-members = ["."]

[package]
name = "toimija"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
which = "8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
