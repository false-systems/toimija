[workspace]
members = ["xtask"]
# Bare `cargo build/test/clippy` (and CI/release) target only the root crate.
# `xtask` and its dev-only deps are built solely via `cargo xtask ...`.
default-members = ["."]

[package]
name = "toimija"
version = "0.1.1"
edition = "2024"
# The sykli CI bin exists alongside the CLI; bare `cargo run` stays toimija.
default-run = "toimija"

[features]
# The sykli CI contract (sykli.rs) — off by default so ordinary builds and
# tests never compile the SDK. The sykli CLI falls back to
# `cargo run --features sykli --bin sykli -- --emit` automatically.
sykli = ["dep:sykli"]

[[bin]]
name = "sykli"
path = "sykli.rs"
required-features = ["sykli"]

[dependencies]
# Pinned to the tag matching the sykli CLI (RC SDKs are not on crates.io).
sykli = { git = "https://github.com/false-systems/sykli", tag = "v0.9.0-rc.1", optional = true }
anyhow = "1"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive"] }
notify = "8.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
teko-protocol = { version = "0.1.0", git = "ssh://git@github.com/false-systems/teko.git", rev = "4c84354cc5903da042a67e3dfd3f5c94b8193dc0" }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
which = "8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
